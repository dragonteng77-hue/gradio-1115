<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d9488">
  <title>目前離線 | 臺南市開放資料檢視器</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      font-family: "Noto Sans TC", system-ui, sans-serif;
      background: linear-gradient(135deg, #0d9488, #0891b2); color: #fff; text-align: center;
    }
    .card { max-width: 420px; padding: 32px 24px; border-radius: 20px; background: rgba(255,255,255,.14); backdrop-filter: blur(6px); }
    .emoji { font-size: clamp(3rem, 14vw, 4.5rem); }
    h1 { font-size: clamp(1.3rem, 5vw, 1.8rem); margin: 12px 0 8px; }
    p { margin: 0 0 20px; opacity: .92; line-height: 1.6; }
    button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px; font-size: 1rem; font-weight: 700; color: #0d9488; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>目前沒有網路連線</h1>
    <p>此工具需要連線才能下載並處理開放資料。請檢查網路後重新載入。</p>
    <button onclick="location.reload()">重新載入</button>
  </div>
</body>
</html>
